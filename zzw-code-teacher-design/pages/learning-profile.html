<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* ============================================
   ZZW Code Teacher — Brand Design Tokens
   Deep-space IDE aesthetic with cyan accent
   ============================================ */

:root {
  /* === Color System === */
  /* Core brand palette */
  --color-primary: #00E5FF;
  --color-primary-hover: #33EBFF;
  --color-primary-muted: rgba(0, 229, 255, 0.12);
  --color-primary-subtle: rgba(0, 229, 255, 0.06);
  --color-auxiliary: #7C3AED;
  --color-auxiliary-hover: #9155F0;
  --color-auxiliary-muted: rgba(124, 58, 237, 0.12);

  /* Background layers */
  --bg-app: #0A0E17;
  --bg-surface: #111827;
  --bg-elevated: #1A2035;
  --bg-overlay: #1E293B;
  --bg-input: #0D1321;
  --bg-hover: rgba(255, 255, 255, 0.04);
  --bg-active: rgba(0, 229, 255, 0.08);

  /* Text hierarchy */
  --text-primary: #F1F5F9;
  --text-secondary: #94A3B8;
  --text-tertiary: #64748B;
  --text-muted: #475569;
  --text-inverse: #0F172A;
  --text-accent: #00E5FF;

  /* Borders */
  --border-default: rgba(255, 255, 255, 0.08);
  --border-subtle: rgba(255, 255, 255, 0.04);
  --border-strong: rgba(255, 255, 255, 0.15);
  --border-focus: #00E5FF;
  --border-accent: rgba(0, 229, 255, 0.3);

  /* State colors */
  --state-success: #10B981;
  --state-success-bg: rgba(16, 185, 129, 0.1);
  --state-warning: #F59E0B;
  --state-warning-bg: rgba(245, 158, 11, 0.1);
  --state-error: #EF4444;
  --state-error-bg: rgba(239, 68, 68, 0.1);
  --state-info: #3B82F6;
  --state-info-bg: rgba(59, 130, 246, 0.1);

  /* Difficulty colors */
  --diff-easy: #10B981;
  --diff-medium: #F59E0B;
  --diff-hard: #EF4444;

  /* === Typography === */
  --font-code: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', ui-monospace, monospace;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

  /* Type scale */
  --text-xs: 0.6875rem;     /* 11px */
  --text-sm: 0.75rem;       /* 12px */
  --text-base: 0.8125rem;   /* 13px */
  --text-md: 0.875rem;      /* 14px */
  --text-lg: 1rem;          /* 16px */
  --text-xl: 1.125rem;     /* 18px */
  --text-2xl: 1.25rem;      /* 20px */
  --text-3xl: 1.5rem;       /* 24px */
  --text-4xl: 1.875rem;     /* 30px */

  /* Line height */
  --leading-tight: 1.25;
  --leading-snug: 1.35;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* Font weight */
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* === Spacing === */
  --space-0: 0;
  --space-1: 0.25rem;   /* 4px */
  --space-2: 0.5rem;    /* 8px */
  --space-3: 0.75rem;   /* 12px */
  --space-4: 1rem;      /* 16px */
  --space-5: 1.25rem;   /* 20px */
  --space-6: 1.5rem;    /* 24px */
  --space-8: 2rem;      /* 32px */
  --space-10: 2.5rem;   /* 40px */
  --space-12: 3rem;     /* 48px */

  /* === Radius === */
  --radius-sm: 2px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
  --shadow-glow-primary: 0 0 12px rgba(0, 229, 255, 0.15);
  --shadow-glow-auxiliary: 0 0 12px rgba(124, 58, 237, 0.15);

  /* === Transitions === */
  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;
  --transition-slow: 300ms ease;

  /* === Layout === */
  --navbar-height: 48px;
  --sidebar-width: 260px;
  --ai-panel-width: 380px;
  --terminal-height: 200px;
  --tab-height: 36px;
  --statusbar-height: 24px;
}

/* === Global Resets === */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-ui);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  color: var(--text-primary);
  background-color: var(--bg-app);
  overflow: hidden;
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-full);
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.2);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
