    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff;
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759;
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30;
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12);

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}
    </style>
    <style id="component-vars">
/*
 * components.css - aggregated component CSS
 */

.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--spacing)*1.5);height:40px;padding:0 20px;border:none;border-radius:calc(var(--radius)*2);background:transparent;color:var(--foreground);font:600 14px/1 var(--font-sans);letter-spacing:var(--tracking-normal);white-space:nowrap;box-shadow:var(--shadow-sm);cursor:pointer;transition:background-color .18s ease,color .18s ease,opacity .18s ease,filter .18s ease}
.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{filter:brightness(.96)}
.btn-secondary{height:48px;padding:0 24px;background:var(--secondary);color:var(--secondary-foreground)}
.btn-secondary:hover{background:var(--muted)}
.btn-text{height:48px;padding:0 4px;box-shadow:none}
.btn-text:hover{color:var(--primary)}
.btn-lg{height:56px;padding:0 28px;font-size:16px}

.card{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--card-foreground);box-shadow:var(--shadow-xs);transition:border-color .2s ease,transform .2s ease}
.card:hover{border-color:var(--primary);transform:translateY(-1px)}
.media{aspect-ratio:1;border-radius:calc(var(--radius) - 4px);background:linear-gradient(135deg,var(--secondary),var(--background));border:1px solid var(--border)}
.eyebrow{color:var(--muted-foreground);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.title{font-size:15px;line-height:1.25}
.price{font-variant-numeric:tabular-nums}
.cta{display:inline-flex;align-self:flex-start;padding:7px 10px;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:12px;text-decoration:none}
.muted{color:var(--muted-foreground)}
.is-disabled{opacity:.55}

.field{display:flex;align-items:center;gap:calc(var(--spacing)*2);min-width:240px;height:44px;padding:0 calc(var(--spacing)*3);border:1px solid var(--input);border-radius:var(--radius);background:var(--background);color:var(--foreground);box-shadow:var(--shadow-xs)}
.field.small{height:40px}
.field:focus-within{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring)}
.field.disabled{opacity:.55}
.icon,.clear{padding:0;border:0;background:transparent;color:var(--icon-muted);font:inherit}
.icon{font-size:13px}
.control{flex:1;border:0;outline:0;background:transparent;color:inherit;font:inherit}
.control::placeholder{color:var(--muted-foreground)}

.webbar,.mobile{border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.webbar{display:flex;align-items:center;gap:calc(var(--spacing)*2);min-width:320px;height:44px;padding:0 calc(var(--spacing)*3);border-radius:var(--radius);background:var(--sidebar)}
.brand{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.link,.tab{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;color:inherit;text-decoration:none;white-space:nowrap;transition:background-color .18s ease,color .18s ease,opacity .18s ease}
.link{height:32px;padding:0 calc(var(--spacing)*2.5)}
.link:hover,.tab:hover{background:var(--secondary)}
.link:focus-visible,.tab:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.dark{background:var(--sidebar);color:var(--foreground)}
.disabled{opacity:.48}
.disabled .link,.disabled .tab{pointer-events:none}
    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);
    --color-popover: var(--popover);
    --color-popover-foreground: var(--popover-foreground);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-secondary: var(--secondary);
    --color-secondary-foreground: var(--secondary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-accent: var(--accent);
    --color-accent-foreground: var(--accent-foreground);
    --color-destructive: var(--destructive);
    --color-destructive-foreground: var(--destructive-foreground);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --color-chart-1: var(--chart-1);
    --color-chart-2: var(--chart-2);
    --color-chart-3: var(--chart-3);
    --color-chart-4: var(--chart-4);
    --color-chart-5: var(--chart-5);
    --color-sidebar: var(--sidebar);
    --color-sidebar-foreground: var(--sidebar-foreground);
    --color-sidebar-primary: var(--sidebar-primary);
    --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
    --color-sidebar-accent: var(--sidebar-accent);
    --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  }
  @layer base {
    body { background: var(--background); color: var(--foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* ===== Page-specific styles ===== */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.5;
        letter-spacing: var(--tracking-normal);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* App shell */
      .app-shell {
        display: flex;
        height: 100vh;
        width: 100vw;
        background: var(--background);
        color: var(--foreground);
      }

      /* Left sidebar */
      .app-sidebar {
        width: 72px;
        min-width: 72px;
        height: 100%;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 16px;
        border-right: 1px solid rgba(255,255,255,0.06);
      }
      .sidebar-logo {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #f5f5f7;
        margin-bottom: 32px;
      }
      .sidebar-nav {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        flex: 1;
      }
      .sidebar-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 56px;
        height: 56px;
        border-radius: calc(var(--radius) * 0.8);
        color: #aeaeb2;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.18s ease, color 0.18s ease;
        font-size: 10px;
        font-weight: 500;
      }
      .sidebar-item:hover {
        background: rgba(255,255,255,0.08);
        color: #f5f5f7;
      }
      .sidebar-item.active {
        background: rgba(0,122,255,0.15);
        color: #007aff;
      }
      .sidebar-item[data-icon] {
        width: 20px;
        height: 20px;
        margin-bottom: 2px;
      }
      .sidebar-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, #007aff, #5856d6);
        margin-bottom: 16px;
        flex-shrink: 0;
      }

      /* Main content area */
      .main-area {
        flex: 1;
        display: flex;
        overflow: hidden;
        min-width: 0;
      }

      /* Problem Description Panel */
      .problem-panel {
        width: 280px;
        min-width: 280px;
        height: 100%;
        background: #f5f5f7;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .problem-panel::-webkit-scrollbar {
        width: 4px;
      }
      .problem-panel::-webkit-scrollbar-thumb {
        background: var(--background-400);
        border-radius: 2px;
      }
      .problem-header {
        padding: 20px 20px 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .problem-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-800);
      }
      .difficulty-badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: #e9f9ee;
        color: #34c759;
        letter-spacing: 0.02em;
      }
      .problem-title {
        padding: 12px 20px 0;
        font-size: 18px;
        font-weight: 700;
        color: var(--text-900);
        line-height: 1.3;
      }
      .problem-desc {
        padding: 16px 20px;
        font-size: 13px;
        color: var(--text-600);
        line-height: 1.6;
      }
      .problem-section {
        padding: 0 20px 16px;
      }
      .problem-section-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-500);
        margin-bottom: 10px;
      }
      .code-block {
        background: #0a0a0a;
        border-radius: calc(var(--radius) * 0.6);
        padding: 12px 16px;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.7;
        color: #f5f5f7;
        overflow-x: auto;
      }
      .code-block .code-label {
        font-size: 10px;
        color: #aeaeb2;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 4px;
        font-weight: 600;
      }
      .code-block .code-line {
        display: block;
      }
      .code-block .code-line + .code-line {
        margin-top: 2px;
      }
      .hint-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: calc(var(--radius) * 0.5);
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-600);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.18s ease;
        font-family: var(--font-sans);
        width: 100%;
      }
      .hint-toggle:hover {
        background: var(--background-200);
      }
      .hint-content {
        margin-top: 8px;
        padding: 10px 12px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) * 0.5);
        font-size: 12px;
        color: var(--text-600);
        line-height: 1.5;
      }
      .problem-actions {
        margin-top: auto;
        padding: 16px 20px;
        border-top: 1px solid var(--border);
      }
      .btn-reset {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        height: 36px;
        border-radius: calc(var(--radius) * 1.5);
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text-600);
        font-size: 13px;
        font-weight: 500;
        font-family: var(--font-sans);
        cursor: pointer;
        transition: background-color 0.18s ease;
      }
      .btn-reset:hover {
        background: var(--background-200);
      }

      /* Code Editor Panel */
      .editor-panel {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #0a0a0a;
      }
      .editor-tabbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 40px;
        min-height: 40px;
        padding: 0 16px;
        background: #1c1c1e;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .editor-tabs {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .editor-tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 14px;
        border-radius: 6px 6px 0 0;
        font-size: 12px;
        font-weight: 500;
        color: #aeaeb2;
        background: transparent;
        border: none;
        cursor: pointer;
        font-family: var(--font-mono);
        transition: background-color 0.18s ease, color 0.18s ease;
      }
      .editor-tab.active {
        background: #0a0a0a;
        color: #f5f5f7;
      }
      .editor-tab:hover:not(.active) {
        background: rgba(255,255,255,0.06);
        color: #f5f5f7;
      }
      .editor-cursor-info {
        font-family: var(--font-mono);
        font-size: 11px;
        color: #aeaeb2;
      }
      .editor-body {
        flex: 1;
        overflow: auto;
        padding: 0;
      }
      .editor-body::-webkit-scrollbar {
        width: 8px;
      }
      .editor-body::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.12);
        border-radius: 4px;
      }
      .editor-body::-webkit-scrollbar-track {
        background: transparent;
      }
      .code-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .code-table td {
        padding: 0 0;
        height: 24px;
        vertical-align: top;
        white-space: pre;
      }
      .line-number {
        width: 48px;
        min-width: 48px;
        text-align: right;
        padding-right: 16px !important;
        font-family: var(--font-mono);
        font-size: 12px;
        color: #48484a;
        user-select: none;
        -webkit-user-select: none;
      }
      .code-content {
        padding-left: 8px !important;
        font-family: var(--font-mono);
        font-size: 13px;
        line-height: 24px;
        color: #f5f5f7;
      }
      .line-active {
        background: rgba(255,255,255,0.04);
      }
      /* Syntax colors */
      .syn-keyword { color: #f5b35a; }
      .syn-function { color: #007aff; }
      .syn-string { color: #2f6b4a; }
      .syn-comment { color: #aeaeb2; font-style: italic; }
      .syn-paren { color: #f5f5f7; }
      .syn-param { color: #c7c7cc; }

      /* Output Panel */
      .output-panel {
        width: 300px;
        min-width: 300px;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #f5f5f7;
        border-left: 1px solid var(--border);
      }
      .output-tabbar {
        display: flex;
        align-items: center;
        height: 40px;
        min-height: 40px;
        padding: 0 16px;
        gap: 0;
        background: #fff;
        border-bottom: 1px solid var(--border);
      }
      .output-tab {
        display: inline-flex;
        align-items: center;
        height: 40px;
        padding: 0 14px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-500);
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        cursor: pointer;
        font-family: var(--font-sans);
        transition: color 0.18s ease, border-color 0.18s ease;
      }
      .output-tab.active {
        color: var(--text-900);
        border-bottom-color: var(--primary);
      }
      .output-tab:hover:not(.active) {
        color: var(--text-700);
      }
      .output-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
        overflow-y: auto;
      }
      .output-console {
        flex: 1;
        min-height: 200px;
        background: #0a0a0a;
        border-radius: calc(var(--radius) * 0.6);
        padding: 16px;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        border: 1px solid rgba(255,255,255,0.06);
      }
      .output-placeholder {
        font-family: var(--font-mono);
        font-size: 12px;
        color: #48484a;
        line-height: 1.6;
      }
      .output-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .btn-submit {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 40px;
        border-radius: calc(var(--radius) * 1.5);
        border: none;
        background: var(--primary);
        color: var(--primary-foreground);
        font-size: 14px;
        font-weight: 600;
        font-family: var(--font-sans);
        cursor: pointer;
        transition: filter 0.18s ease;
        box-shadow: var(--shadow-sm);
      }
      .btn-submit:hover {
        filter: brightness(0.96);
      }
      .btn-run {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 36px;
        border-radius: calc(var(--radius) * 1.5);
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text-700);
        font-size: 13px;
        font-weight: 500;
        font-family: var(--font-sans);
        cursor: pointer;
        transition: background-color 0.18s ease;
      }
      .btn-run:hover {
        background: var(--background-200);
      }
    </style>
</head>
