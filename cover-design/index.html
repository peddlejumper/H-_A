<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H# Programming Tutorial - Modern Geometric Cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="cover-container">
        <canvas id="geometricCanvas"></canvas>
        
        <div class="content-layer">
            <div class="title-section">
                <div class="version-badge">v0.4</div>
                <h1 class="main-title">
                    <span class="title-cn">H# 程序设计教程</span>
                    <span class="title-en">H# Programming Tutorial</span>
                </h1>
                <div class="subtitle">中英双语版 · Chinese-English Bilingual Edition</div>
            </div>
            
            <div class="geometric-accent">
                <div class="hex-shape hex-1"></div>
                <div class="hex-shape hex-2"></div>
                <div class="hex-shape hex-3"></div>
            </div>
            
            <div class="author-section">
                <div class="author-label">作者 / Author</div>
                <div class="author-name">peddlejumper</div>
                <div class="author-date">2026</div>
            </div>
            
            <div class="features-preview">
                <div class="feature-tag">自举编译器</div>
                <div class="feature-tag">字节码虚拟机</div>
                <div class="feature-tag">现代语法</div>
            </div>
        </div>
        
        <div class="overlay-effects"></div>
    </div>

    <script src="js/geometric-shapes.js"></script>
    <script src="js/code-flow.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/gradients.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
